      - name: Make proactive bubbles clickable and auto-open chat keyboard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_CHAT_TOUCH'
          from pathlib import Path
          import re

          service_path = Path('app/src/main/java/com/dshpet/android/PetService.kt')
          service = service_path.read_text(encoding='utf-8')
          start = service.find('    private fun say(pet: Pet, text: String')
          end = service.find('    private fun placeBubble(', start)
          if start < 0 or end < 0:
              raise SystemExit('Cannot find PetService.say()/placeBubble() anchors')
          block = service[start:end]
          if 'openChat: Boolean = false' not in block:
              block = block.replace(
                  '    private fun say(pet: Pet, text: String) {',
                  '    private fun say(pet: Pet, text: String, openChat: Boolean = false) {', 1,
              )
          if '.text = if (openChat)' not in block:
              text_match = re.search(r'(?m)^(?P<i>[ \t]*)(?P<obj>this|tv)\.text = text[ \t]*$', block)
              if not text_match:
                  raise SystemExit('Cannot locate bubble text assignment inside say(); see the "Diagnose original source structure" step log')
              block = (
                  block[:text_match.start()]
                  + text_match.group('i') + text_match.group('obj')
                  + '.text = if (openChat) "$text\\n· 点我聊天" else text'
                  + block[text_match.end():]
              )
          # Token-based edits: independent of line layout, indentation and one-line vs multi-line flags.
          if 'if (openChat) 9000L' not in block:
              timeout_match = re.search(r'(bubbleUntilMs\s*=\s*now\s*\+\s*)3600L', block)
              if not timeout_match:
                  raise SystemExit('Cannot find bubble timeout anchor inside say(); see the "Diagnose original source structure" step log')
              block = (
                  block[:timeout_match.start()] + timeout_match.group(1)
                  + 'if (openChat) 9000L else 3600L' + block[timeout_match.end():]
              )
          if 'if (openChat) 0 else WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE' not in block:
              flag_match = re.search(r'(?<![\w.])(?:(?:WindowManager\.)?LayoutParams\.)?FLAG_NOT_TOUCHABLE\b', block)
              if not flag_match:
                  raise SystemExit('Cannot locate FLAG_NOT_TOUCHABLE in say(); see the "Diagnose original source structure" step log')
              block = (
                  block[:flag_match.start()]
                  + '(if (openChat) 0 else WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE)'
                  + block[flag_match.end():]
              )
          if '点击主动气泡打开聊天失败' not in block:
              anchor_match = re.search(r'(?m)^[ \t]*box\.addView\(\s*tv\b', block)
              click_code = '''        if (openChat) {
            val openChatListener = View.OnClickListener {
                dismissBubble()
                try {
                    startActivity(
                        Intent(this, LocalCompanionActivity::class.java)
                            .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                    )
                } catch (t: Throwable) {
                    Diag.record(this, "点击主动气泡打开聊天失败", t)
                }
            }
            // Both the text card and its decorative tail enter chat.
            box.isClickable = true
            box.setOnClickListener(openChatListener)
            tv.isClickable = true
            tv.setOnClickListener(openChatListener)
          }
          '''
              if not anchor_match:
                  raise SystemExit('Cannot find bubble TextView insertion anchor; see the "Diagnose original source structure" step log')
              block = block[:anchor_match.start()] + click_code + block[anchor_match.start():]
          service = service[:start] + block + service[end:]
          proactive_call = 'say(pet, LocalCompanionMemory.proactiveLine(this))'
          if 'say(pet, LocalCompanionMemory.proactiveLine(this), openChat = true)' not in service:
              if proactive_call not in service:
                  raise SystemExit('Cannot find proactive companion bubble call')
              service = service.replace(proactive_call, 'say(pet, LocalCompanionMemory.proactiveLine(this), openChat = true)', 1)
          # App-use nudges are also invitations to continue chatting.
          app_reminder_call = 'say(pet, message)'
          if 'say(pet, message, openChat = true)' not in service:
              if app_reminder_call not in service:
                  raise SystemExit('Cannot find social-app reminder bubble call')
              service = service.replace(app_reminder_call, 'say(pet, message, openChat = true)', 1)
          # Insert only inside onPetTapped by matching braces; preserve tapCount, dialogue, animation and Sfx lines.
          tap_marker = '点击桌宠本体打开离线聊天失败'
          if tap_marker not in service:
              tap_match = re.search(
                  r'(?m)^(?P<i>[ \t]*)private fun onPetTapped\(pet: Pet\) \{', service
              )
              if not tap_match:
                  raise SystemExit('Cannot locate PetService.onPetTapped(pet: Pet)')
              open_brace = tap_match.end() - 1

              def matching_brace(source, opening):
                  depth = 0
                  i = opening
                  quote = None
                  escaped = False
                  line_comment = False
                  block_comment = False
                  while i < len(source):
                      ch = source[i]
                      nxt = source[i + 1] if i + 1 < len(source) else ''
                      if line_comment:
                          if ch == '\n':
                              line_comment = False
                          i += 1
                          continue
                      if block_comment:
                          if ch == '*' and nxt == '/':
                              block_comment = False
                              i += 2
                          else:
                              i += 1
                          continue
                      if quote:
                          if escaped:
                              escaped = False
                          elif ch == '\\':
                              escaped = True
                          elif ch == quote:
                              quote = None
                          i += 1
                          continue
                      if ch == '/' and nxt == '/':
                          line_comment = True
                          i += 2
                          continue
                      if ch == '/' and nxt == '*':
                          block_comment = True
                          i += 2
                          continue
                      if ch == '"' and source.startswith('"""', i):
                          end_raw = source.find('"""', i + 3)
                          if end_raw < 0:
                              raise SystemExit('Unterminated raw string while locating onPetTapped body')
                          i = end_raw + 3
                          while i < len(source) and source[i] == '"':
                              i += 1
                          continue
                      if ch == '"' or ch == "'":
                          quote = ch
                          i += 1
                          continue
                      if ch == '{':
                          depth += 1
                      elif ch == '}':
                          depth -= 1
                          if depth == 0:
                              return i
                      i += 1
                  raise SystemExit('Unbalanced braces while locating onPetTapped body')

              close_brace = matching_brace(service, open_brace)
              indent = tap_match.group('i')
              addition = (
                  '\n' + indent + '    // 直接点击桌宠打开本地聊天；保留原有点击计数、台词和音效调用。\n' +
                  indent + '    dismissBubble()\n' +
                  indent + '    if (!LocalCompanionMemory.isChatOpen(this)) {\n' +
                  indent + '        try {\n' +
                  indent + '            startActivity(\n' +
                  indent + '                Intent(this, LocalCompanionActivity::class.java)\n' +
                  indent + '                    .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)\n' +
                  indent + '            )\n' +
                  indent + '        } catch (t: Throwable) {\n' +
                  indent + '            Diag.record(this, "点击桌宠本体打开离线聊天失败", t)\n' +
                  indent + '        }\n' +
                  indent + '    }\n' + indent
              )
              service = service[:close_brace] + addition + service[close_brace:]
          else:
              print('onPetTapped already contains the direct-chat marker; keeping current function body.')
          service_path.write_text(service, encoding='utf-8')

          activity_path = Path('app/src/main/java/com/dshpet/android/LocalCompanionActivity.kt')
          activity = activity_path.read_text(encoding='utf-8')
          if 'import android.view.inputmethod.InputMethodManager' not in activity:
              anchor = 'import android.view.inputmethod.EditorInfo\n'
              if anchor not in activity:
                  raise SystemExit('Cannot locate chat activity input-method imports')
              activity = activity.replace(anchor, anchor + 'import android.view.inputmethod.InputMethodManager\nimport android.view.WindowManager\n', 1)
          if 'imm?.showSoftInput(input, InputMethodManager.SHOW_IMPLICIT)' not in activity:
              pattern = re.compile(r'(?m)^(?P<i>[ \t]*)setContentView\(root\)\n(?P=i)updateProactiveButton\(\)\n(?P=i)renderHistory\(\)$')
              match = pattern.search(activity)
              if not match:
                  raise SystemExit('Cannot locate chat activity setContentView/initial render block')
              i = match.group('i')
              replacement = (
                  f'{i}window.setSoftInputMode(\n'
                  f'{i}    WindowManager.LayoutParams.SOFT_INPUT_ADJUST_RESIZE or\n'
                  f'{i}        WindowManager.LayoutParams.SOFT_INPUT_STATE_ALWAYS_VISIBLE\n'
                  f'{i})\n'
                  f'{i}setContentView(root)\n'
                  f'{i}updateProactiveButton()\n'
                  f'{i}renderHistory()\n'
                  f'{i}input.requestFocus()\n'
                  f'{i}input.post {{\n'
                  f'{i}    val imm = getSystemService(INPUT_METHOD_SERVICE) as? InputMethodManager\n'
                  f'{i}    imm?.showSoftInput(input, InputMethodManager.SHOW_IMPLICIT)\n'
                  f'{i}}}'
              )
              activity = activity[:match.start()] + replacement + activity[match.end():]
          activity_path.write_text(activity, encoding='utf-8')
          # Android 13+: declared POST_NOTIFICATIONS must also be requested at runtime,
          # otherwise birthday and midnight-rest notifications are silently dropped.
          main_path = Path('app/src/main/java/com/dshpet/android/MainActivity.kt')
          main_text = main_path.read_text(encoding='utf-8')
          perm_marker = 'requestPermissions(arrayOf(android.Manifest.permission.POST_NOTIFICATIONS)'
          if perm_marker not in main_text:
              perm_anchor = '        DailyReminderScheduler.schedule(this)\n'
              if perm_anchor not in main_text:
                  raise SystemExit('Cannot locate MainActivity DailyReminderScheduler anchor for notification permission')
              perm_block = (
                  perm_anchor +
                  '        if (android.os.Build.VERSION.SDK_INT >= 33 &&\n'
                  '            checkSelfPermission(android.Manifest.permission.POST_NOTIFICATIONS) != android.content.pm.PackageManager.PERMISSION_GRANTED\n'
                  '        ) {\n'
                  '            try {\n'
                  '                requestPermissions(arrayOf(android.Manifest.permission.POST_NOTIFICATIONS), 8219)\n'
                  '            } catch (_: Throwable) { }\n'
                  '        }\n'
              )
              main_path.write_text(main_text.replace(perm_anchor, perm_block, 1), encoding='utf-8')
          print('Notification runtime permission request ensured.')
          print('Proactive bubbles are touchable and open the chat; chat launch requests the keyboard.')
          PY_CHAT_TOUCH

      - name: Ensure imports and launcher icon reference
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_IMPORTS'
          from pathlib import Path
          import re

          base = Path('app/src/main/java/com/dshpet/android')
          needs = {
              'MainActivity.kt': [
                  'android.graphics.Color', 'android.provider.Settings', 'android.content.Intent',
                  'android.widget.Toast', 'android.net.Uri',
              ],
              'PetService.kt': [
                  'android.content.Intent', 'android.view.View', 'android.view.WindowManager',
                  'android.os.SystemClock',
              ],
          }
          for name, imports in needs.items():
              path = base / name
              text = path.read_text(encoding='utf-8')
              pkg = re.search(r'(?m)^package [^\n]+\n', text)
              if not pkg:
                  raise SystemExit(f'No package line in {name}')
              added = []
              for fq in imports:
                  package_name, simple = fq.rsplit('.', 1)
                  if f'import {fq}\n' in text or f'import {package_name}.*' in text:
                      continue
                  if re.search(r'(?<![\w.])' + simple + r'\b', text):
                      added.append(fq)
              if added:
                  text = text[:pkg.end()] + '\n' + ''.join(f'import {fq}\n' for fq in added) + text[pkg.end():]
                  path.write_text(text, encoding='utf-8')
              print(f'{name}: added imports {added}')
          PY_IMPORTS
          S=app/src/main/java/com/dshpet/android
          if ls app/src/main/res/drawable*/ic_launcher.* > /dev/null 2>&1; then
            echo 'R.drawable.ic_launcher resource exists.'
          elif ls app/src/main/res/mipmap*/ic_launcher.* > /dev/null 2>&1; then
            echo 'No drawable ic_launcher; switching generated references to R.mipmap.ic_launcher.'
            grep -rl 'R\.drawable\.ic_launcher' "$S" | xargs -r sed -i 's/R\.drawable\.ic_launcher/R.mipmap.ic_launcher/g'
          else
            echo 'No ic_launcher resource found anywhere.' >&2
            exit 1
          fi

