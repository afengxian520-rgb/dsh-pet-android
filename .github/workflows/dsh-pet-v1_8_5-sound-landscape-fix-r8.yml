          ls app/src/main/res/drawable*/ic_launcher.* app/src/main/res/mipmap*/ic_launcher.* > /dev/null 2>&1 || { echo 'No ic_launcher resource in any drawable* or mipmap* folder' >&2; exit 1; }
          test -s app/src/main/assets/webp/a001.webp
          test -s app/src/main/assets/webp/a106.webp
          count=$(find app/src/main/assets/webp -maxdepth 1 -type f -name '*.webp' | wc -l)
          test "$count" -eq 106
          echo "Verified all $count animation files and original whale artwork."

      - name: Verify original click sounds are restored unchanged
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_SFX'
          import hashlib
          import zipfile
          from pathlib import Path

          source = Path('/tmp/dsh-pet-v1.8.1-480p-24fps.apk')
          mapping = {
              'res/raw/tap_press.mp3': Path('app/src/main/res/raw/tap_press.mp3'),
              'res/raw/tap_release.mp3': Path('app/src/main/res/raw/tap_release.mp3'),
          }
          with zipfile.ZipFile(source) as apk:
              for internal, target in mapping.items():
                  expected = apk.read(internal)
                  if not target.is_file():
                      raise SystemExit(f'Missing restored original click sound: {target}')
                  actual = target.read_bytes()
                  if actual != expected:
                      raise SystemExit(f'Click sound differs from the original APK: {target}')
                  digest = hashlib.sha256(actual).hexdigest()
                  print(f'Original click sound verified: {target} ({len(actual)} bytes, sha256={digest})')
          PY_SFX

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK integrity, signature and all custom features
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          # Diagnostic only (never fails the build): show where the original tap/click sounds are triggered.
          echo '== Sfx call sites in source =='
          grep -rn 'Sfx\.' app/src/main/java/com/dshpet/android || true
          echo '== sound toggle in Prefs =='
          grep -n -i 'sound' app/src/main/java/com/dshpet/android/Prefs.kt || true
          # Original click sounds must be present, and synthetic replacement tones are forbidden.
          test -s app/src/main/res/raw/tap_press.mp3
          test -s app/src/main/res/raw/tap_release.mp3
          test ! -e app/src/main/res/raw/tap_press.wav
          test ! -e app/src/main/res/raw/tap_release.wav
          grep -q 'R.raw.tap_press' app/src/main/java/com/dshpet/android/Sfx.kt
          grep -q 'R.raw.tap_release' app/src/main/java/com/dshpet/android/Sfx.kt
          # Old controls and interaction mechanics are mandatory: additions must not replace original functionality.
          grep -q 'R.id.btnSound' app/src/main/java/com/dshpet/android/MainActivity.kt
          grep -q 'R.id.btnPets' app/src/main/java/com/dshpet/android/MainActivity.kt
          grep -q 'btnLinesEdit = findViewById' app/src/main/java/com/dshpet/android/MainActivity.kt
          grep -q 'btnLinesExport = findViewById' app/src/main/java/com/dshpet/android/MainActivity.kt
          grep -q 'btnLinesImport = findViewById' app/src/main/java/com/dshpet/android/MainActivity.kt
          grep -q 'btnLinesReload = findViewById' app/src/main/java/com/dshpet/android/MainActivity.kt
          grep -q 'btnKeepAlive = findViewById' app/src/main/java/com/dshpet/android/MainActivity.kt
          grep -q 'btnEdge = findViewById' app/src/main/java/com/dshpet/android/MainActivity.kt
          grep -q 'btnBubble = findViewById' app/src/main/java/com/dshpet/android/MainActivity.kt
          grep -q 'private fun showActionMenu' app/src/main/java/com/dshpet/android/PetService.kt
          grep -q 'private fun onPetTapped' app/src/main/java/com/dshpet/android/PetService.kt
          grep -q 'private fun onPetThrown' app/src/main/java/com/dshpet/android/PetService.kt
          grep -q 'fun tick(): Boolean' app/src/main/java/com/dshpet/android/Pet.kt
          grep -q 'fun playAction(slug: String)' app/src/main/java/com/dshpet/android/Pet.kt
          grep -q 'android:name=".BootReceiver"' app/src/main/AndroidManifest.xml
          test -s app/src/main/assets/lines.json
          grep -q 'const val MAX_PETS = 10' app/src/main/java/com/dshpet/android/Prefs.kt
          grep -q 'landscapeVisibleOnLandscape' app/src/main/java/com/dshpet/android/Prefs.kt
          grep -q 'android.permission.PACKAGE_USAGE_STATS' app/src/main/AndroidManifest.xml
          grep -q '横屏自动收起设置' app/src/main/res/values/strings.xml
          grep -q 'if (h.view.visibility != targetVisibility) h.view.visibility = targetVisibility' app/src/main/java/com/dshpet/android/PetService.kt
          ! grep -q 'foregroundPackageCache = null' app/src/main/java/com/dshpet/android/PetService.kt
          grep -q 'proactiveOn' app/src/main/java/com/dshpet/android/Prefs.kt
          grep -q 'DailyReminderScheduler' app/src/main/java/com/dshpet/android/DailyReminderScheduler.kt
          grep -q 'maybeSendAppReminder' app/src/main/java/com/dshpet/android/PetService.kt
          grep -q 'LocalCompanionMemory' app/src/main/java/com/dshpet/android/LocalCompanionMemory.kt
          grep -q 'btnCompanion' app/src/main/res/layout/activity_main.xml
          grep -q 'LocalCompanionActivity' app/src/main/AndroidManifest.xml
          grep -q 'Theme.DeviceDefault.Dialog.NoActionBar' app/src/main/AndroidManifest.xml
          grep -q 'private fun configurePopupWindow' app/src/main/java/com/dshpet/android/LocalCompanionActivity.kt
          grep -q 'import android.widget.FrameLayout' app/src/main/java/com/dshpet/android/LocalCompanionActivity.kt
          grep -q 'historyScroll.addView(messages, FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT))' app/src/main/java/com/dshpet/android/LocalCompanionActivity.kt
          if grep -q 'ScrollView.LayoutParams' app/src/main/java/com/dshpet/android/LocalCompanionActivity.kt; then
            echo 'Invalid ScrollView.LayoutParams found in local chat activity.' >&2
            exit 1
          fi
          grep -q '点击桌宠本体打开离线聊天失败' app/src/main/java/com/dshpet/android/PetService.kt
          grep -q 'openChat = true' app/src/main/java/com/dshpet/android/PetService.kt
          grep -q 'showSoftInput(input' app/src/main/java/com/dshpet/android/LocalCompanionActivity.kt
          grep -q 'FLAG_NOT_TOUCHABLE' app/src/main/java/com/dshpet/android/PetService.kt
          grep -q 'if (openChat) 0 else WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE' app/src/main/java/com/dshpet/android/PetService.kt
          grep -q 'say(pet, message, openChat = true)' app/src/main/java/com/dshpet/android/PetService.kt
          grep -q 'android.permission.SCHEDULE_EXACT_ALARM' app/src/main/AndroidManifest.xml
          grep -q 'requestPermissions(arrayOf(android.Manifest.permission.POST_NOTIFICATIONS)' app/src/main/java/com/dshpet/android/MainActivity.kt
          grep -q 'PERSONALITY_TSUNDERE_SWEET' app/src/main/java/com/dshpet/android/LocalCompanionMemory.kt
          grep -q 'fun removeMemory' app/src/main/java/com/dshpet/android/LocalCompanionMemory.kt
          grep -q 'fun clearHistory' app/src/main/java/com/dshpet/android/LocalCompanionMemory.kt
          grep -q 'android:dataExtractionRules="@xml/data_extraction_rules"' app/src/main/AndroidManifest.xml
          grep -q 'cetacea_loli_local_v1.xml' app/src/main/res/xml/backup_rules.xml
          grep -q 'val effectiveSizeDp = if (count > 1) minOf(sizeDp, fitLimitDp) else sizeDp' app/src/main/java/com/dshpet/android/PetService.kt
          if grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml; then
            echo 'Offline companion build must not request INTERNET permission.' >&2
            exit 1
          fi
          python3 - <<'PY_ORDER'
          import re
          from pathlib import Path

          lines = Path('app/src/main/java/com/dshpet/android/MainActivity.kt').read_text(encoding='utf-8').splitlines()

          def first(pattern):
              for number, line in enumerate(lines, 1):
                  if re.search(pattern, line):
                      return number
              return None

          for btn, refresh in (('btnLandscape', 'refreshLandscapeButton'), ('btnProactive', 'refreshProactiveButton')):
              init = first(rf'\b{btn} = findViewById')
              call = first(rf'(?<!fun ){refresh}\(\)')
              if init is None or call is None:
                  raise SystemExit(f'Cannot locate {btn} init or {refresh}() call in MainActivity.kt')
              if call < init:
                  raise SystemExit(f'{refresh}() is called (line {call}) before {btn} is initialised (line {init})')
              print(f'{refresh}() at line {call} is after {btn} init at line {init}')
          PY_ORDER
          test -s "$APK"
          unzip -tq "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          python3 - <<'PY_VERIFY'
          import zipfile
          from pathlib import Path

          apk = Path('app/build/outputs/apk/debug/app-debug.apk')
          with zipfile.ZipFile(apk) as z:
              names = set(z.namelist())
              required = {
                  'AndroidManifest.xml',
                  'classes.dex',
                  'assets/pet-config.json',
                  'assets/lines.json',
                  'assets/webp/a001.webp',
                  'assets/webp/a103.webp',
                  'assets/webp/a106.webp',
                  'res/layout/activity_main.xml',
                  'res/xml/backup_rules.xml',
                  'res/xml/data_extraction_rules.xml',
                  'resources.arsc',
              }
              missing = sorted(required - names)
              if missing:
                  raise SystemExit(f'APK missing required entries: {missing}')
              animations = sorted(
                  n for n in names if n.startswith('assets/webp/') and n.endswith('.webp')
              )
              expected = {f'assets/webp/a{i:03d}.webp' for i in range(1, 107)}
              if set(animations) != expected:
                  raise SystemExit(f'APK has {len(animations)} animations, expected 106')
              dex = b''.join(z.read(n) for n in names if n.startswith('classes') and n.endswith('.dex'))
              if b'BirthdaySchedule' not in dex or b'birthdayCelebration' not in dex:
                  raise SystemExit('Birthday scheduler or celebration code is absent from DEX')
              if b'landscapeVisibleOnLandscape' not in dex or b'updateLandscapeVisibility' not in dex:
                  raise SystemExit('Landscape show/hide switch is absent from DEX')
              if b'hasUsageAccess' not in dex or b'isHomeOrOwnAppForeground' not in dex:
                  raise SystemExit('Foreground-app detection is absent from DEX')
              if b'DailyReminderScheduler' not in dex:
                  raise SystemExit('Midnight rest reminder class is absent from DEX')
              if b'LocalCompanionMemory' not in dex or b'LocalCompanionActivity' not in dex:
                  raise SystemExit('Offline chat or persistent local memory is absent from DEX')
              if b'removeMemory' not in dex or b'clearHistory' not in dex or b'PERSONALITY_TSUNDERE_SWEET' not in dex:
                  raise SystemExit('Local memory controls or full persona config is absent from DEX')
              if b'maybeSendAppReminder' not in dex or b'isScreenInteractiveUnlocked' not in dex:
                  raise SystemExit('Proactive companion or app reminder bytecode is absent from DEX')
          print(f'APK verified: {apk.stat().st_size} bytes; 106 animations; birthday, landscape, proactive companion, offline chat and local-memory bytecode present.')
          PY_VERIFY
          mkdir -p build-delivery
          cp "$APK" build-delivery/dsh-pet-full-v1.8.5.apk
          sha256sum build-delivery/dsh-pet-full-v1.8.5.apk | tee build-delivery/SHA256SUMS.txt
          cat > build-delivery/BUILD-INFO.txt <<'EOF'
          App: 大肥鱼桌宠增强版（原装功能 + 生日 + 横屏 + 主动陪伴提醒）
          Version: 1.8.5
          Application ID: com.dshpet.android
          Included: original settings, editable line library/import/export, click sound, touch/throw physics, edge-hide, keep-alive, original whale art and all 106 WebP animations; 1-10 pets; landscape auto-hide and return-to-home restore with Usage Access (orientation fallback otherwise), plus a separate keep-visible-in-landscape switch; birthday date/time, annual reminder, notification, greeting and celebration dance; local in-character proactive message about every 15 minutes, personality-aware rule-based offline chat with persistent local memory and chat history; quiet hours 22:00-08:00; supported social-app use reminders after 60 seconds with 45-minute global cooldown, 90-minute same-app cooldown and 5/day cap; midnight rest reminder notification.
          Verification: APK ZIP integrity, Android APK signature, required resources, all 106 animations, and birthday/landscape/proactive-reminder bytecode verified in CI.
          Runtime note: a successful CI build does not replace installation and behavior testing on the target phone. Android battery restrictions may delay reminders.
          Signing note: this is debug-signed; if Android reports a signature conflict with an older installation, back up settings and uninstall the older version before installing this build.
          EOF

      - name: Upload APK and verification records
        uses: actions/upload-artifact@v4
        with:
          name: bigfish-v1.8.5-offline-companion-apk
          path: build-delivery/*
          if-no-files-found: error
          retention-days: 7
