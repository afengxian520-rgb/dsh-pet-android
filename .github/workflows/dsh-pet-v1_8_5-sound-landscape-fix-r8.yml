name: Build Android APK - v1.8.5 Sound and Landscape Fix (r8 runner SDK)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Diagnose original source structure (non-fatal)
        shell: bash
        run: |
          set +e
          S=app/src/main/java/com/dshpet/android
          echo '=== defaultConfig / version ==='
          grep -n -E 'defaultConfig|versionCode|versionName' app/build.gradle.kts
          echo '=== ic_launcher resources ==='
          ls app/src/main/res/drawable*/ic_launcher.* app/src/main/res/mipmap*/ic_launcher.* 2>&1
          echo '=== BootReceiver in manifest (cat -A shows tabs as ^I) ==='
          grep -n -B1 -A6 'BootReceiver' app/src/main/AndroidManifest.xml | cat -A | head -30
          echo '=== INTERNET permission ==='
          grep -n 'INTERNET' app/src/main/AndroidManifest.xml || echo '(none)'
          echo '=== MainActivity imports of interest ==='
          grep -n -E '^import android\.(graphics\.Color|provider\.Settings|net\.Uri|content\.Intent|widget\.Toast)' $S/MainActivity.kt
          echo '=== MainActivity chipPets / btn init ==='
          grep -n -E 'chipPets|btnPets|findViewById' $S/MainActivity.kt | head -60
          echo '=== PetService function anchors ==='
          grep -n -E 'private fun (say|placeBubble|onPetTapped|onPetThrown|tickSpeech)' $S/PetService.kt
          echo '=== PetService.say() body (up to 90 lines) ==='
          awk '/private fun say\(pet: Pet, text: String/{p=1} p{print NR": "$0; n++} n>=90{exit}' $S/PetService.kt
          echo '=== PetService.onPetTapped body (up to 40 lines) ==='
          awk '/private fun onPetTapped\(pet: Pet\)/{p=1} p{print NR": "$0; n++} n>=40{exit}' $S/PetService.kt
          echo '=== Sfx call sites ==='
          grep -rn 'Sfx\.' $S
          echo '=== speak gate anchor ==='
          grep -n 'category != "summon"' $S/PetService.kt
          exit 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK (preinstalled runner SDK first, sdkmanager only if needed)
        shell: bash
        run: |
          set -uo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Android SDK root: $SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          have_all() {
            [ -d "$SDK_ROOT/platform-tools" ] \
              && [ -d "$SDK_ROOT/platforms/android-34" ] \
              && [ -d "$SDK_ROOT/build-tools/34.0.0" ]
          }
          if have_all; then
            echo 'platform-tools, Android 34 platform and build-tools 34.0.0 are already installed; skipping sdkmanager.'
            exit 0
          fi
          SDKM="$(command -v sdkmanager || true)"
          if [ -z "$SDKM" ]; then
            SDKM="$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -n 1 || true)"
          fi
          if [ -z "$SDKM" ] || [ ! -x "$SDKM" ]; then
            echo "sdkmanager not found under $SDK_ROOT/cmdline-tools and not on PATH." >&2
            exit 1
          fi
          echo "Using sdkmanager: $SDKM"
          # A license prompt closes the pipe early; ignore the SIGPIPE status of 'yes'.
          yes | "$SDKM" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          for attempt in 1 2 3; do
            "$SDKM" --sdk_root="$SDK_ROOT" --install 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0' || true
            if have_all; then
              break
            fi
            echo "SDK package install attempt $attempt did not complete; retrying in $((attempt * 15)) seconds" >&2
            sleep $((attempt * 15))
          done
          if ! have_all; then
            echo 'Required Android SDK packages are still missing after 3 attempts.' >&2
            exit 1
          fi
          echo 'Verified platform-tools, Android 34 platform and build-tools 34.0.0.'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore original whale art and 106 animation assets
        shell: bash
        run: |
          set -euo pipefail
          APK_SOURCE="/tmp/dsh-pet-v1.8.1-480p-24fps.apk"
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://github.com/Tony-Chen-Stark/dsh-pet-android/releases/download/v1.8.1/dsh-pet-v1.8.1-480p-24fps.apk' \
            --output "$APK_SOURCE"
          EXPECTED_APK_SHA256='71d851add2ad1a4cb0b8b4cedda0501ac20be368c4f4c914725482bccd743bf3'
          ACTUAL_APK_SHA256="$(sha256sum "$APK_SOURCE" | awk '{print $1}')"
          echo "Source APK SHA-256: $ACTUAL_APK_SHA256"
          if [ "$ACTUAL_APK_SHA256" != "$EXPECTED_APK_SHA256" ]; then
            echo "APK integrity check failed. Expected: $EXPECTED_APK_SHA256; actual: $ACTUAL_APK_SHA256" >&2
            exit 1
          fi
          echo "Source APK SHA-256 verified."
          python3 - <<'PY_ASSETS'
          import zipfile
          from pathlib import Path

          source = Path('/tmp/dsh-pet-v1.8.1-480p-24fps.apk')
          root = Path('.')
          webp_dir = root / 'app/src/main/assets/webp'
          webp_dir.mkdir(parents=True, exist_ok=True)
          for old in webp_dir.glob('*.webp'):
              old.unlink()
          expected = {f'a{i:03d}.webp' for i in range(1, 107)}
          with zipfile.ZipFile(source) as apk:
              assets = {
                  Path(name).name: name
                  for name in apk.namelist()
                  if name.startswith('assets/webp/') and name.endswith('.webp')
              }
              if set(assets) != expected:
                  raise SystemExit(
                      f'Animation asset mismatch: got {len(assets)}; '
                      f'missing={sorted(expected-set(assets))}; extra={sorted(set(assets)-expected)}'
                  )
              for filename in sorted(expected):
                  data = apk.read(assets[filename])
                  if not data:
                      raise SystemExit(f'Empty animation: {filename}')
                  (webp_dir / filename).write_bytes(data)
              drawables = {
                  'res/drawable-nodpi-v4/whale_selfie.png': root / 'app/src/main/res/drawable-nodpi/whale_selfie.png',
                  'res/drawable/whale_cutout.png': root / 'app/src/main/res/drawable/whale_cutout.png',
              }
              for internal, target in drawables.items():
                  try:
                      data = apk.read(internal)
                  except KeyError:
                      raise SystemExit(f'Missing original artwork in source APK: {internal}')
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)

              # Restore the original tap sounds byte-for-byte. Do not replace them with synthesized tones.
              sounds = {
                  'res/raw/tap_press.mp3': root / 'app/src/main/res/raw/tap_press.mp3',
                  'res/raw/tap_release.mp3': root / 'app/src/main/res/raw/tap_release.mp3',
              }
              for internal, target in sounds.items():
                  try:
                      data = apk.read(internal)
                  except KeyError:
                      raise SystemExit(f'Missing original click sound in source APK: {internal}')
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
          print(f'Restored {len(expected)} animation WebPs, original whale illustrations, and both original click MP3s.')
          PY_ASSETS

      - name: Add birthday greeting and celebration feature
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def patch(path, before, after, marker):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if marker in text:
                  print(f"Already patched: {path}")
                  return
              if before not in text:
                  raise SystemExit(f"Cannot patch {path}; source anchor not found: {before[:90]!r}")
              p.write_text(text.replace(before, after, 1), encoding="utf-8")
              print(f"Patched: {path}")

          # Settings page: birthday date, reminder time, save, clear and test buttons.
          patch(
              "app/src/main/res/layout/activity_main.xml",
              "            <!-- 台词库：用户可以自己改 -->",
              '''            <!-- 生日祝福与庆祝表演 -->
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="16dp"
                  android:background="@drawable/bg_card"
                  android:orientation="vertical"
                  android:padding="16dp">

                  <TextView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="@string/birthday_title"
                      android:textColor="@color/text"
                      android:textSize="15sp"
                      android:textStyle="bold" />

                  <TextView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="6dp"
                      android:text="@string/birthday_hint"
                      android:textColor="@color/text_dim"
                      android:textSize="12sp" />

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="12dp"
                      android:orientation="horizontal">

                      <TextView
                          android:id="@+id/birthdayDate"
                          android:layout_width="0dp"
                          android:layout_height="48dp"
                          android:layout_marginEnd="5dp"
                          android:layout_weight="1"
                          android:background="@drawable/bg_btn_ghost"
                          android:clickable="true"
                          android:focusable="true"
                          android:gravity="center"
                          android:text="@string/birthday_choose_date"
                          android:textColor="@color/text_sub"
                          android:textSize="13sp" />

                      <TextView
                          android:id="@+id/birthdayTime"
                          android:layout_width="0dp"
                          android:layout_height="48dp"
                          android:layout_marginStart="5dp"
                          android:layout_weight="1"
                          android:background="@drawable/bg_btn_ghost"
                          android:clickable="true"
                          android:focusable="true"
                          android:gravity="center"
                          android:text="@string/birthday_time_default"
                          android:textColor="@color/text_sub"
                          android:textSize="13sp" />
                  </LinearLayout>

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="10dp"
                      android:orientation="horizontal">

                      <TextView
                          android:id="@+id/btnBirthdaySave"
                          android:layout_width="0dp"
                          android:layout_height="46dp"
                          android:layout_marginEnd="5dp"
                          android:layout_weight="1"
                          android:background="@drawable/bg_btn_primary"
                          android:clickable="true"
                          android:focusable="true"
                          android:gravity="center"
                          android:text="@string/birthday_save"
                          android:textColor="#FFFFFF"
                          android:textSize="13sp"
                          android:textStyle="bold" />

                      <TextView
                          android:id="@+id/btnBirthdayTest"
                          android:layout_width="0dp"
                          android:layout_height="46dp"
                          android:layout_marginStart="5dp"
                          android:layout_weight="1"
                          android:background="@drawable/bg_btn_ghost"
                          android:clickable="true"
                          android:focusable="true"
                          android:gravity="center"
                          android:text="@string/birthday_test"
                          android:textColor="@color/text_sub"
                          android:textSize="13sp" />
                  </LinearLayout>

                  <TextView
                      android:id="@+id/btnBirthdayClear"
                      android:layout_width="match_parent"
                      android:layout_height="40dp"
                      android:layout_marginTop="4dp"
                      android:clickable="true"
                      android:focusable="true"
                      android:gravity="center"
                      android:text="@string/birthday_clear"
                      android:textColor="@color/text_dim"
                      android:textSize="12sp" />
              </LinearLayout>

            <!-- 台词库：用户可以自己改 -->''',
              "@+id/btnBirthdayTest",
          )

          # UI strings.
          patch(
              "app/src/main/res/values/strings.xml",
              "</resources>",
              '''    <string name="birthday_title">🎂 生日祝福与表演</string>
              <string name="birthday_hint">每年生日当天，大肥鱼会在设定时间送上祝福，并跳一段庆祝舞。要尽量准时，可按提示允许“闹钟和提醒”；未授权时仍会尝试提醒，但系统省电可能延迟。</string>
              <string name="birthday_choose_date">选择生日日期</string>
              <string name="birthday_date_value">生日：%1$d月%2$d日</string>
              <string name="birthday_time_default">祝福时间：09:00</string>
              <string name="birthday_time_value">祝福时间：%1$02d:%2$02d</string>
              <string name="birthday_save">保存生日安排</string>
              <string name="birthday_test">立即试演</string>
              <string name="birthday_clear">清除生日安排</string>
              <string name="birthday_pick_date_first">请先选择生日日期。</string>
              <string name="birthday_saved">已安排每年 %1$d月%2$d日 %3$02d:%4$02d 送上祝福。</string>
              <string name="birthday_cleared">生日安排已清除。</string>
              <string name="birthday_test_need_pet">请先授权悬浮窗并点击“放出来”，再试演。</string>
              <string name="birthday_test_started">大肥鱼开始试演祝福啦！</string>

          </resources>''',
              'name="birthday_title"',
          )

          # PetService: manual test and birthday alarm share the same performance action.
          patch(
              "app/src/main/java/com/dshpet/android/PetService.kt",
              '        const val ACTION_LINES = "com.dshpet.android.action.LINES"\n',
              '''        const val ACTION_LINES = "com.dshpet.android.action.LINES"
              const val ACTION_BIRTHDAY = "com.dshpet.android.action.BIRTHDAY"

              /** Called by the birthday alarm or the settings-page test button. */
              fun celebrateNow(ctx: Context) {
                  try {
                      val i = Intent(ctx, PetService::class.java).setAction(ACTION_BIRTHDAY)
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) ctx.startForegroundService(i)
                      else ctx.startService(i)
                  } catch (t: Throwable) {
                      Diag.record(ctx, "启动生日表演失败", t)
                  }
              }
          ''',
              "const val ACTION_BIRTHDAY =",
          )
          patch(
              "app/src/main/java/com/dshpet/android/PetService.kt",
              "                else -> {\n                    if (held.isEmpty()) spawnAll(Prefs.sizeDp(this))\n                }\n",
              "                ACTION_BIRTHDAY -> {\n                    val alreadyVisible = held.isNotEmpty()\n                    if (!alreadyVisible && Settings.canDrawOverlays(this)) {\n                        spawnAll(Prefs.sizeDp(this))\n                    }\n                    // Delay birthday speech so the generic startup greeting does not replace it.\n                    handler.postDelayed({ birthdayCelebration() }, if (alreadyVisible) 300L else 1900L)\n                }\n                else -> {\n                    if (held.isEmpty()) spawnAll(Prefs.sizeDp(this))\n                }\n",
              "ACTION_BIRTHDAY ->",
          )
          patch(
              "app/src/main/java/com/dshpet/android/PetService.kt",
              "    // ------------------------------------------------------------ 帧循环\n",
              '''    /** 生日当天：送上专属祝福，并播放现有的庆祝舞动画。 */
              private fun birthdayCelebration() {
                  try {
                      val pet = held.firstOrNull()?.pet ?: return
                      lastInteractMs = SystemClock.uptimeMillis()
                      say(pet, "主人，生日快乐！🎂 今天你最大！大肥鱼特地为你跳一段庆祝舞，愿你每天开心、愿望都实现！")
                      val action = listOf("a103", "a026", "a057").firstOrNull { cfg?.names?.containsKey(it) == true }
                      if (action != null) pet.playAction(action)
                      else Diag.record(this, "生日庆祝动画未找到，已发送文字祝福")
                  } catch (t: Throwable) {
                      Diag.record(this, "生日祝福/表演失败", t)
                  }
              }

              // ------------------------------------------------------------ 帧循环
          ''',
              "private fun birthdayCelebration()",
          )

          # Annual birthday scheduler. It reschedules after every alarm and handles Feb 29.
          Path("app/src/main/java/com/dshpet/android/BirthdaySchedule.kt").write_text(r'''package com.dshpet.android

          import android.app.AlarmManager
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.os.Build
          import android.provider.Settings
          import java.util.Calendar

          /** Annual local birthday reminder. System power saving may delay it by a few minutes. */
          object BirthdaySchedule {
              const val ACTION_BIRTHDAY = "com.dshpet.android.action.BIRTHDAY_ALARM"
              private const val PREFS = "dsh_pet_birthday"
              private const val KEY_MONTH = "month"
              private const val KEY_DAY = "day"
              private const val KEY_HOUR = "hour"
              private const val KEY_MINUTE = "minute"
              private const val KEY_ENABLED = "enabled"
              private const val REQUEST_CODE = 8217
              private const val CHANNEL_ID = "dsh_pet_birthday"
              private const val NOTIFICATION_ID = 8217

              private fun prefs(ctx: Context) = ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
              fun month(ctx: Context): Int = prefs(ctx).getInt(KEY_MONTH, 0)
              fun day(ctx: Context): Int = prefs(ctx).getInt(KEY_DAY, 0)
              fun hour(ctx: Context): Int = prefs(ctx).getInt(KEY_HOUR, 9).coerceIn(0, 23)
              fun minute(ctx: Context): Int = prefs(ctx).getInt(KEY_MINUTE, 0).coerceIn(0, 59)

              fun hasBirthday(ctx: Context): Boolean =
                  prefs(ctx).getBoolean(KEY_ENABLED, false) && month(ctx) in 1..12 && day(ctx) in 1..31

              fun set(ctx: Context, month: Int, day: Int, hour: Int, minute: Int) {
                  require(month in 1..12 && day in 1..31 && hour in 0..23 && minute in 0..59) {
                      "无效的生日日期或时间"
                  }
                  val valid = if (month == 2 && day == 29) true else try {
                      Calendar.getInstance().apply {
                          clear()
                          isLenient = false
                          set(2001, month - 1, day, 12, 0, 0)
                      }.timeInMillis
                      true
                  } catch (_: Throwable) { false }
                  require(valid) { "无效的生日日期" }
                  prefs(ctx).edit()
                      .putInt(KEY_MONTH, month).putInt(KEY_DAY, day)
                      .putInt(KEY_HOUR, hour).putInt(KEY_MINUTE, minute)
                      .putBoolean(KEY_ENABLED, true).apply()
                  schedule(ctx)
              }

              fun clear(ctx: Context) {
                  cancel(ctx)
                  prefs(ctx).edit().putBoolean(KEY_ENABLED, false)
                      .putInt(KEY_MONTH, 0).putInt(KEY_DAY, 0).apply()
              }

              fun schedule(ctx: Context) {
                  if (!hasBirthday(ctx)) { cancel(ctx); return }
                  val alarms = ctx.getSystemService(Context.ALARM_SERVICE) as? AlarmManager ?: return
                  val pending = alarmPendingIntent(ctx)
                  val triggerAt = nextOccurrence(month(ctx), day(ctx), hour(ctx), minute(ctx)).timeInMillis
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                          if (alarms.canScheduleExactAlarms()) {
                          alarms.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, triggerAt, pending)
                          } else {
                          alarms.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, triggerAt, pending)
                          }
                      } else if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          alarms.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, triggerAt, pending)
                      } else {
                          alarms.setExact(AlarmManager.RTC_WAKEUP, triggerAt, pending)
                      }
                  } catch (_: Throwable) { }
              }

              private fun cancel(ctx: Context) {
                  try {
                      (ctx.getSystemService(Context.ALARM_SERVICE) as? AlarmManager)?.cancel(alarmPendingIntent(ctx))
                  } catch (_: Throwable) { }
              }

              private fun alarmPendingIntent(ctx: Context): PendingIntent = PendingIntent.getBroadcast(
                  ctx, REQUEST_CODE,
                  Intent(ctx, BirthdayReceiver::class.java).setAction(ACTION_BIRTHDAY),
                  PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE,
              )

              private fun nextOccurrence(month: Int, day: Int, hour: Int, minute: Int): Calendar {
                  val now = System.currentTimeMillis()
                  val startYear = Calendar.getInstance().get(Calendar.YEAR)
                  for (year in startYear..(startYear + 12)) {
                      try {
                          val candidate = Calendar.getInstance().apply {
                              clear()
                              isLenient = false
                              set(year, month - 1, day, hour, minute, 0)
                              set(Calendar.MILLISECOND, 0)
                          }
                          if (candidate.timeInMillis > now) return candidate
                      } catch (_: Throwable) { /* February 29 on a non-leap year: try the next year. */ }
                  }
                  return Calendar.getInstance().apply { add(Calendar.YEAR, 1) }
              }

              fun showNotification(ctx: Context) {
                  try {
                      val manager = ctx.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O && manager.getNotificationChannel(CHANNEL_ID) == null) {
                          manager.createNotificationChannel(NotificationChannel(
                              CHANNEL_ID, "大肥鱼生日祝福", NotificationManager.IMPORTANCE_HIGH,
                          ).apply { description = "生日当天的大肥鱼祝福与表演提醒" })
                      }
                      val open = PendingIntent.getActivity(
                          ctx, REQUEST_CODE, Intent(ctx, MainActivity::class.java),
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE,
                      )
                      val notification = Notification.Builder(ctx, CHANNEL_ID)
                          .setSmallIcon(R.drawable.ic_launcher)
                          .setContentTitle("主人，生日快乐！🎂")
                          .setContentText("大肥鱼准备了生日祝福和庆祝表演，点开看看吧。")
                          .setStyle(Notification.BigTextStyle().bigText(
                              "主人，生日快乐！大肥鱼准备了专属祝福和庆祝舞。愿你新的一岁开心顺利、心愿成真！"
                          ))
                          .setContentIntent(open).setAutoCancel(true)
                          .setWhen(System.currentTimeMillis()).build()
                      manager.notify(NOTIFICATION_ID, notification)
                  } catch (_: SecurityException) {
                      // If Android 13+ notification permission was declined, the pet can still perform the animation.
                  } catch (_: Throwable) { }
              }
          }

          class BirthdayReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent?) {
                  if (intent?.action != BirthdaySchedule.ACTION_BIRTHDAY) return
                  BirthdaySchedule.schedule(context) // Schedule the next year immediately.
                  BirthdaySchedule.showNotification(context)
                  if (Prefs.running(context) && Settings.canDrawOverlays(context)) {
                      PetService.celebrateNow(context)
                  }
              }
          }
          ''', encoding="utf-8")

          # Ask for exact-alarm special access; keep a safe inexact fallback when denied.
          patch(
              "app/src/main/AndroidManifest.xml",
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />',
              'android.permission.SCHEDULE_EXACT_ALARM',
          )

          # Tolerant BootReceiver registration: when the exact historical anchor is absent,
          # edit the real <receiver> element in place (any indentation / attribute order).
          import re as _re_boot
          _manifest = Path("app/src/main/AndroidManifest.xml")
          _mtext = _manifest.read_text(encoding="utf-8")
          _exact_boot = (
              "        <receiver\n            android:name=\".BootReceiver\"\n            android:exported=\"true\">\n"
              "            <intent-filter>\n"
              "                <action android:name=\"android.intent.action.BOOT_COMPLETED\" />\n"
              "                <action android:name=\"android.intent.action.MY_PACKAGE_REPLACED\" />\n"
              "            </intent-filter>\n        </receiver>"
          )
          if 'android:name=".BirthdayReceiver"' not in _mtext and _exact_boot not in _mtext:
