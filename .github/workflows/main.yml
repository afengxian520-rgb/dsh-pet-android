name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Repair missing drawable references
        shell: bash
        run: |
          set -euo pipefail
          FILE="app/src/main/res/layout/activity_main.xml"
          test -f "$FILE"
          sed -i \
            -e 's/@drawable\/whale_selfie/@drawable\/ic_launcher/g' \
            -e 's/@drawable\/whale_cutout/@drawable\/ic_launcher/g' \
            "$FILE"

      - name: Generate missing sound resources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/raw
          python3 - <<'PY'
          import math
          import struct
          import wave
          from pathlib import Path

          output = Path("app/src/main/res/raw")
          output.mkdir(parents=True, exist_ok=True)

          for name, frequency, duration in [
              ("tap_press", 520, 0.05),
              ("tap_release", 880, 0.06),
          ]:
              target = output / f"{name}.wav"
              if target.exists():
                  continue
              rate = 22050
              count = int(rate * duration)
              frames = bytearray()
              for i in range(count):
                  t = i / rate
                  envelope = math.exp(-65 * t) * (1 - i / count)
                  sample = int(6500 * envelope * math.sin(2 * math.pi * frequency * t))
                  frames.extend(struct.pack("<h", sample))
              with wave.open(str(target), "wb") as wav:
                  wav.setnchannels(1)
                  wav.setsampwidth(2)
                  wav.setframerate(rate)
                  wav.writeframes(frames)
              print(f"Created {target}")
          PY

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bigfish-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
