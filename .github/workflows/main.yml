name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Repair missing drawable references
        shell: bash
        run: |
          set -euo pipefail
          FILE="app/src/main/res/layout/activity_main.xml"
          if [ ! -f "$FILE" ]; then
            echo "找不到 $FILE；请检查仓库根目录结构。"
            exit 1
          fi
          sed -i \
            -e 's/@drawable\/whale_selfie/@drawable\/ic_launcher/g' \
            -e 's/@drawable\/whale_cutout/@drawable\/ic_launcher/g' \
            "$FILE"
          echo "Remaining whale drawable references:"
          grep -nE '@drawable/whale_(selfie|cutout)' "$FILE" || true

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bigfish-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
