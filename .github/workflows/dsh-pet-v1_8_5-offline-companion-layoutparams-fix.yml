name: Build Android APK - v1.8.5 Offline Companion (LayoutParams Fix)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (current command-line tools; no legacy tools package)
        uses: android-actions/setup-android@v4
        with:
          # Use the current official command-line tools revision. Do not request the retired "tools" package.
          cmdline-tools-version: 15859902
          packages: 'platform-tools'
          # The action reads this with getBooleanInput(): only true/false are valid ('yes' makes the step fail).
          accept-android-sdk-licenses: 'true'

      - name: Install Android 34 build platform
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore original whale art and 106 animation assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK_SOURCE="/tmp/dsh-pet-v1.8.1-480p-24fps.apk"
          RELEASE_META="/tmp/dsh-pet-v1.8.1-release-metadata.json"
          RELEASE_API="https://api.github.com/repos/Tony-Chen-Stark/dsh-pet-android/releases/tags/v1.8.1"
          curl --fail --location --retry 3 --retry-delay 2 \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "$RELEASE_API" --output "$RELEASE_META"
          python3 - "$RELEASE_META" "$APK_SOURCE" <<'PY_ASSET_DOWNLOAD'
          import hashlib
          import json
          import subprocess
          import sys
          import time
          from pathlib import Path

          metadata_path = Path(sys.argv[1])
          target = Path(sys.argv[2])
          metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
          asset_name = "dsh-pet-v1.8.1-480p-24fps.apk"
          assets = [asset for asset in metadata.get("assets", []) if asset.get("name") == asset_name]
          if len(assets) != 1:
              raise SystemExit(f"Release metadata must contain exactly one {asset_name!r}; found {len(assets)}")
          asset = assets[0]
          digest_field = asset.get("digest") or ""
          if not digest_field.startswith("sha256:"):
              raise SystemExit(f"GitHub Release API did not provide a SHA-256 digest for {asset_name}; refusing a download that cannot be verified")
          expected_sha = digest_field.split(":", 1)[1].lower()
          if len(expected_sha) != 64 or any(ch not in "0123456789abcdef" for ch in expected_sha):
              raise SystemExit(f"Invalid SHA-256 digest returned by GitHub Release API: {digest_field!r}")
          expected_size = int(asset.get("size", 0))
          if expected_size < 10_000_000:
              raise SystemExit(f"Unexpected release asset size {expected_size}; refusing a wrong or partial asset")
          download_url = asset.get("browser_download_url")
          if not download_url or not download_url.startswith("https://github.com/Tony-Chen-Stark/dsh-pet-android/releases/download/"):
              raise SystemExit(f"Unexpected release asset download URL: {download_url!r}")
          print(f"Pinned asset: {asset_name}; asset id={asset.get('id')}; expected bytes={expected_size}")
          print(f"Verifying against the SHA-256 published by GitHub Release API: {expected_sha}")
          for attempt in range(1, 4):
              target.unlink(missing_ok=True)
              result = subprocess.run([
                  "curl", "--fail", "--location", "--retry", "3", "--retry-delay", "2",
                  "--retry-all-errors", download_url, "--output", str(target)
              ], check=False)
              if result.returncode == 0 and target.is_file():
                  actual_size = target.stat().st_size
                  h = hashlib.sha256()
                  with target.open("rb") as downloaded:
                      for chunk in iter(lambda: downloaded.read(1024 * 1024), b""):
                          h.update(chunk)
                  actual_sha = h.hexdigest()
                  if actual_size == expected_size and actual_sha == expected_sha:
                      print(f"Asset integrity verified on attempt {attempt}: bytes={actual_size}; sha256={actual_sha}")
                      break
                  print(f"Attempt {attempt}/3 mismatched authoritative metadata: size={actual_size}/{expected_size}; sha256={actual_sha}/{expected_sha}", file=sys.stderr)
              else:
                  print(f"Attempt {attempt}/3 failed to download the asset (curl exit={result.returncode})", file=sys.stderr)
              target.unlink(missing_ok=True)
              if attempt < 3:
                  time.sleep(attempt * 2)
          else:
              raise SystemExit("Release APK did not match published GitHub SHA-256/size after 3 attempts; refusing to extract unverified assets")
          PY_ASSET_DOWNLOAD
          python3 - <<'PY_ASSETS'
          import zipfile
          from pathlib import Path

          source = Path('/tmp/dsh-pet-v1.8.1-480p-24fps.apk')
          root = Path('.')
          webp_dir = root / 'app/src/main/assets/webp'
          webp_dir.mkdir(parents=True, exist_ok=True)
          for old in webp_dir.glob('*.webp'):
              old.unlink()
          expected = {f'a{i:03d}.webp' for i in range(1, 107)}
          with zipfile.ZipFile(source) as apk:
              assets = {
                  Path(name).name: name
                  for name in apk.namelist()
                  if name.startswith('assets/webp/') and name.endswith('.webp')
              }
              if set(assets) != expected:
                  raise SystemExit(
                      f'Animation asset mismatch: got {len(assets)}; '
                      f'missing={sorted(expected-set(assets))}; extra={sorted(set(assets)-expected)}'
                  )
              for filename in sorted(expected):
                  data = apk.read(assets[filename])
                  if not data:
                      raise SystemExit(f'Empty animation: {filename}')
                  (webp_dir / filename).write_bytes(data)
              drawables = {
                  'res/drawable-nodpi-v4/whale_selfie.png': root / 'app/src/main/res/drawable-nodpi/whale_selfie.png',
                  'res/drawable/whale_cutout.png': root / 'app/src/main/res/drawable/whale_cutout.png',
              }
              for internal, target in drawables.items():
                  try:
                      data = apk.read(internal)
                  except KeyError:
                      raise SystemExit(f'Missing original artwork in source APK: {internal}')
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
          print(f'Restored {len(expected)} animation WebPs and original whale illustrations.')
          PY_ASSETS

      - name: Add birthday greeting and celebration feature
