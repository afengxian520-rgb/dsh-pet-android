              '    // ------------------------------------------------------------ 帧循环\n',
              '''    /** Hide only the overlay view in landscape; do not stop the service or destroy pet state. */
              private var usageEventsLastQueryMs = 0L
              private var usageEventsLoaded = false
              private var foregroundPackageCache: String? = null

              @Suppress("DEPRECATION")
              private fun hasUsageAccess(): Boolean = try {
                  val appOps = getSystemService(Context.APP_OPS_SERVICE) as AppOpsManager
                  appOps.checkOpNoThrow(AppOpsManager.OPSTR_GET_USAGE_STATS, Process.myUid(), packageName) == AppOpsManager.MODE_ALLOWED
              } catch (_: Throwable) { false }

              private fun foregroundPackage(): String? {
                  if (!hasUsageAccess()) return null
                  return try {
                      val now = System.currentTimeMillis()
                      val begin = if (!usageEventsLoaded) now - 24L * 60L * 60L * 1000L
                                  else (usageEventsLastQueryMs - 1000L).coerceAtLeast(now - 10L * 60L * 1000L)
                      val manager = getSystemService(Context.USAGE_STATS_SERVICE) as UsageStatsManager
                      val events = manager.queryEvents(begin, now)
                      val event = UsageEvents.Event()
                      while (events.hasNextEvent()) {
                          events.getNextEvent(event)
                          val pkg = event.packageName ?: continue
                          val type = event.eventType
                          val resumed = type == UsageEvents.Event.MOVE_TO_FOREGROUND ||
                              (Build.VERSION.SDK_INT >= 29 && type == UsageEvents.Event.ACTIVITY_RESUMED)
                          val paused = type == UsageEvents.Event.MOVE_TO_BACKGROUND ||
                              (Build.VERSION.SDK_INT >= 29 && (type == UsageEvents.Event.ACTIVITY_PAUSED || type == UsageEvents.Event.ACTIVITY_STOPPED))
                          if (resumed) foregroundPackageCache = pkg
                          else if (paused && foregroundPackageCache == pkg) foregroundPackageCache = null
                      }
                      usageEventsLoaded = true
                      usageEventsLastQueryMs = now
                      foregroundPackageCache
                  } catch (t: Throwable) {
                      Diag.record(this, "读取前台应用失败", t)
