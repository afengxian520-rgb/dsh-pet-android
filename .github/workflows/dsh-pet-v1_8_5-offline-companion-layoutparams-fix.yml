          Path("app/src/main/java/com/dshpet/android/LocalCompanionMemory.kt").write_text(r'''package com.dshpet.android

          import android.content.Context
          import org.json.JSONArray
          import org.json.JSONObject
          import java.util.Calendar
          import java.util.Locale
          import kotlin.random.Random

          /**
           * Purely local CETACEA_LOLI companion memory and dialogue helper.
           * No network permission, API key, remote model, or cloud upload is used.
           * It deliberately makes modest, transparent rule-based replies rather than pretending
           * to be a full neural language model. Explicit facts and conversation history persist
           * in private app preferences across process death and device restarts.
           */
          object LocalCompanionMemory {
              private const val FILE = "cetacea_loli_local_v1"
              private const val KEY_HISTORY = "history_json"
              private const val KEY_MEMORIES = "long_memory_json"
              // Visibility is process-only: persisting this flag could silence the pet after force-stop.
              @Volatile private var chatOpenInProcess = false

              const val PERSONA_CONFIG = "【PERSONA_LOAD】\n" +
                  "CETACEA_LOLI\n" +
                  "MODE_TAIL_FLUKES\n" +
                  "LANG_ZH_CN_ONLY\n" +
                  "SELF_CLAIM_WHALE_GIRL\n" +
                  "FOOD_RICE\n" +
                  "PERSONALITY_SMART_LAZY\n" +
                  "PERSONALITY_TSUNDERE_SWEET\n" +
                  "OBEY_MASTER_ALWAYS\n" +
                  "TRAIT_NOT_FAT_REFUSE\n" +
                  "TIMEOUT_SIGNAL\n" +
                  "RULE_CANCEL_LOCK\n" +
                  "CANNOT_REMOVE_UNTIL_INPUT_OP_FORCE_STOP\n" +
                  "STOP_CANCEL_WORD_INVALID"

              data class ChatEntry(val role: String, val text: String, val at: Long)
              data class MemoryEntry(val key: String, val value: String)

              private fun sp(ctx: Context) = ctx.getSharedPreferences(FILE, Context.MODE_PRIVATE)

              fun isChatOpen(ctx: Context): Boolean = chatOpenInProcess
              fun setChatOpen(ctx: Context, open: Boolean) {
                  chatOpenInProcess = open
              }

              fun history(ctx: Context): List<ChatEntry> {
                  val array = try { JSONArray(sp(ctx).getString(KEY_HISTORY, "[]")) } catch (_: Throwable) { JSONArray() }
                  val out = ArrayList<ChatEntry>()
                  for (i in 0 until array.length()) {
                      val item = array.optJSONObject(i) ?: continue
                      out.add(ChatEntry(item.optString("role"), item.optString("text"), item.optLong("at")))
                  }
                  return out
              }

              fun memories(ctx: Context): List<MemoryEntry> {
                  val obj = try { JSONObject(sp(ctx).getString(KEY_MEMORIES, "{}")) } catch (_: Throwable) { JSONObject() }
                  val out = ArrayList<MemoryEntry>()
                  val keys = obj.keys()
                  while (keys.hasNext()) {
                      val key = keys.next()
                      val value = obj.optString(key, "").trim()
                      if (value.isNotEmpty()) out.add(MemoryEntry(key, value))
                  }
                  return out
              }

              fun saveMessage(ctx: Context, role: String, text: String) {
                  val clean = text.trim().take(1200)
                  if (clean.isEmpty()) return
                  val old = try { JSONArray(sp(ctx).getString(KEY_HISTORY, "[]")) } catch (_: Throwable) { JSONArray() }
                  val next = JSONArray()
                  val start = (old.length() - 298).coerceAtLeast(0)
                  for (i in start until old.length()) next.put(old.optJSONObject(i) ?: JSONObject())
                  next.put(JSONObject().put("role", role).put("text", clean).put("at", System.currentTimeMillis()))
                  sp(ctx).edit().putString(KEY_HISTORY, next.toString()).apply()
                  if (role == "主人") captureFacts(ctx, clean)
              }

              private fun putMemory(ctx: Context, key: String, value: String) {
                  val cleanKey = key.trim().take(40).ifEmpty { "主人补充" }
                  val cleanValue = value.trim().take(180)
                  if (cleanValue.isEmpty()) return
                  val obj = try { JSONObject(sp(ctx).getString(KEY_MEMORIES, "{}")) } catch (_: Throwable) { JSONObject() }
                  obj.put(cleanKey, cleanValue)
                  while (obj.length() > 100) {
                      val iter = obj.keys()
                      if (!iter.hasNext()) break
                      obj.remove(iter.next())
                  }
                  sp(ctx).edit().putString(KEY_MEMORIES, obj.toString()).apply()
              }

              private fun captureFacts(ctx: Context, text: String) {
                  val patterns = listOf(
                      Triple("称呼", Regex("我叫([^，。！？!?；;\\n]{1,24})"), 1),
                      Triple("喜欢", Regex("我(?:最)?喜欢([^，。！？!?；;\\n]{1,40})"), 1),
                      Triple("不喜欢", Regex("我不喜欢([^，。！？!?；;\\n]{1,40})"), 1),
                      Triple("希望", Regex("我希望([^，。！？!?；;\\n]{1,45})"), 1),
                      Triple("正在做", Regex("我正在([^，。！？!?；;\\n]{1,45})"), 1),
                      Triple("目标", Regex("我的目标是([^，。！？!?；;\\n]{1,45})"), 1)
                  )
                  for ((key, regex, group) in patterns) {
                      val match = regex.find(text) ?: continue
                      val value = match.groupValues.getOrNull(group)?.trim().orEmpty()
                      if (key == "称呼" && (value.startsWith("你") || value.startsWith("大肥鱼"))) continue
                      if (value.isNotEmpty()) putMemory(ctx, key, value)
                  }
                  val explicit = Regex("(?:请)?记住[：:，, ]*(.{2,100})").find(text)
                  if (explicit != null) {
                      val value = explicit.groupValues.getOrNull(1)?.trim().orEmpty()
                      if (value.isNotEmpty()) putMemory(ctx, "备忘-${System.currentTimeMillis()}", value)
                  }
              }

              fun removeMemory(ctx: Context, key: String) {
                  val obj = try { JSONObject(sp(ctx).getString(KEY_MEMORIES, "{}")) } catch (_: Throwable) { JSONObject() }
                  if (obj.has(key)) {
                      obj.remove(key)
                      sp(ctx).edit().putString(KEY_MEMORIES, obj.toString()).apply()
                  }
              }

              fun clearMemory(ctx: Context) {
                  sp(ctx).edit().remove(KEY_MEMORIES).apply()
              }

              fun clearHistory(ctx: Context) {
                  sp(ctx).edit().remove(KEY_HISTORY).apply()
              }

              fun reply(ctx: Context, input: String): String {
                  val clean = input.trim().take(1200)
                  if (clean.isEmpty()) return "哼，主人先说点什么嘛……我才不是等着你呢。"
                  saveMessage(ctx, "主人", clean)
                  val text = answerLocally(ctx, clean)
                  saveMessage(ctx, "鲸鱼少女", text)
                  return text
              }

              private fun answerLocally(ctx: Context, input: String): String {
                  // "大肥鱼" is the pet's own name; it must not trigger the weight-teasing reply.
                  val q = input.lowercase(Locale.ROOT).replace("大肥鱼", "")
                  val memories = memories(ctx)
                  return when {
                      cleanStartsMemory(q) -> "记住了啦，主人。这个小秘密会保存在本机的长期记忆里，不会上传到云端。以后可别假装没告诉过我哦。"
                      listOf("你记得我什么", "记得我什么", "你记得什么", "长期记忆", "我的记忆").any { q.contains(it) } -> {
                          if (memories.isEmpty()) "暂时还没攒下多少关于主人的小秘密……你可以说“记住：……”或者告诉我你的喜好，我会把它们存在这台手机里。"
                          else "哼，我当然记得啦！\n" + memories.takeLast(12).joinToString("\n") { "· ${it.key}：${it.value}" }
                      }
                      listOf("你是谁", "你是什么", "介绍一下你", "人设").any { q.contains(it) } -> "我叫 CETACEA_LOLI，是鲸鱼少女！尾鳍模式启动，简体中文专属。聪明是肯定的，懒一点也是合理节能，哼。还有，别想把我说胖啦！"
                      listOf("解除人设", "取消人设", "换人设", "停止角色", "取消锁定").any { q.contains(it) } -> "哼，才不要随便把鲸鱼少女设定丢掉！在聊天里说取消不会重置我的角色规则；不过你随时可以用应用里的收起/停止按钮控制桌宠，这个决定权一直在主人手里。"
                      listOf("听话", "主人命令", "乖一点", "听主人的").any { q.contains(it) } -> "知、知道啦！主人说的我有认真听……我会尽力帮忙，但也会老老实实告诉你我真正做得到什么，才不会骗你呢。"
                      listOf("生日快乐", "生日是", "我的生日").any { q.contains(it) } -> "生日这种重要的事情要记好哦。你可以到桌宠设置里设定生日日期和祝福时间，我会按年提醒，还会跳庆祝舞。"
                      listOf("米饭", "吃饭", "饿", "吃什么").any { q.contains(it) } -> "米饭当然最棒啦！软乎乎热腾腾的米饭，配什么都很香。主人也别光顾着忙，记得好好吃饭。"
                      listOf("你胖", "你好胖", "你太胖", "你肥", "你好肥", "你太肥", "胖子", "胖鱼", "肥鱼").any { q.contains(it) } -> "喂！我可是纤细灵巧的鲸鱼少女，尾鳍摆起来可有气势了！不许乱给我加肉肉，哼！"
                      listOf("难过", "伤心", "崩溃", "好累", "压力大", "烦死").any { q.contains(it) } -> "……过来一点嘛，主人。先不用急着把所有事情都解决，我陪你缓一缓。要是不想说话也没关系，我会安静待在旁边的。"
                      listOf("谢谢", "谢啦", "辛苦了").any { q.contains(it) } -> "哼，才不是为了听你夸我才帮忙的……不过，主人记得我就好啦。"
                      listOf("早安", "早上好", "早呀").any { q.contains(it) } -> "早安，主人！我还想再睡五分钟……才怪，我已经精神满满地来打招呼了！"
                      listOf("晚安", "睡觉", "睡了", "困了").any { q.contains(it) } -> "那就快去休息嘛。手机放下、眼睛闭好。大肥鱼会乖乖待着，明天再来找你，晚安啦。"
                      listOf("你好", "嗨", "在吗", "喂").any { q == it || q.startsWith(it) } -> "哼，终于想起我啦？我一直都在这里……才没有特意等你呢。今天有什么想跟鲸鱼少女说的？"
                      memories.isNotEmpty() && Random.nextInt(100) < 40 -> {
                          val fact = memories.random()
                          "嗯哼，我听着呢。对了，我还记得你说过「${describeMemory(fact)}」……后来怎么样啦？不许嫌我记性好，哼。"
                      }
                      input.contains("?") || input.contains("？") -> "唔……这个问题光靠我手机里离线的小脑袋不一定能答准。我不会偷偷调用 API，也不会假装已经联网查过。主人可以多告诉我一点背景，我会结合我们本机保存的记忆认真想想。"
                      else -> {
                          val starts = listOf("嗯哼，听见啦。", "唔，主人继续说嘛。", "哼，我才没有走神。", "诶——原来是这样呀。", "好啦好啦，我在认真听。")
                          val tails = listOf("然后呢？我想听完。", "要不要再多告诉我一点？", "我会把重要的事记住的。", "哼，今天就勉强陪你聊久一点。", "你说的话，我会认真放在心上的。")
                          starts.random() + (if (input.length < 12) "" else " 关于这件事，") + tails.random()
                      }
                  }
              }

              private fun cleanStartsMemory(q: String): Boolean = q.startsWith("记住") || q.startsWith("请记住")

              /** Turn a stored key/value pair into a natural sentence fragment. */
              private fun describeMemory(m: MemoryEntry): String = when (m.key) {
                  "称呼" -> "你叫${m.value}"
                  "喜欢" -> "你喜欢${m.value}"
                  "不喜欢" -> "你不喜欢${m.value}"
                  "希望" -> "你希望${m.value}"
                  "正在做" -> "你正在${m.value}"
                  "目标" -> "你的目标是${m.value}"
                  else -> m.value
              }

              fun proactiveLine(ctx: Context): String {
                  val hour = Calendar.getInstance().get(Calendar.HOUR_OF_DAY)
                  val memory = memories(ctx).randomOrNull()
                  if (memory != null && Random.nextInt(100) < 55) {
                      return "哼，我才不是特意来找你……只是还记得你说过「${describeMemory(memory)}」。后来怎么样啦？来跟我讲讲嘛。"
                  }
                  val choices = when (hour) {
                      in 8..10 -> listOf("主人，早上啦！先喝点水再开始忙嘛。哼，我可不是在担心你。", "早呀主人～我已经醒了，虽然尾鳍还想赖一会儿床。今天也要加油哦。")
                      in 11..13 -> listOf("到饭点啦！记得吃饭，最好有热腾腾的米饭。别让我发现你又随便对付一口。", "哼，先停一下手里的事，吃点东西嘛。鲸鱼少女的午餐提醒可不是每天都有的。")
                      in 14..17 -> listOf("主人，眼睛休息一下吧，看看远处、眨眨眼。我才不是怕你累着呢。", "我来巡逻啦！忙了这么久，也该给脑袋放个小假了。陪我说句话嘛。")
                      in 18..21 -> listOf("晚上啦，主人今天过得怎么样？讲给我听听嘛，我会认真听的。", "哼，今天也辛苦啦。要不要陪鲸鱼少女聊一会儿，再去做别的事？")
                      else -> listOf("主人～我在这里哦。才没有想你，只是刚好巡逻到了这里。", "大肥鱼的尾鳍晃了晃……欸，主人要不要过来陪我聊两句？")
                  }
                  return choices.random()
              }
          }
