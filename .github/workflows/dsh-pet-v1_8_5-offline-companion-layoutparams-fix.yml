        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_LOCAL_COMPANION'
          from pathlib import Path

          def patch(path, before, after, marker):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if marker in text:
                  print(f"Already patched: {path}")
                  return
