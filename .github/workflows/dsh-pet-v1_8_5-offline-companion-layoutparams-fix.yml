          Path("app/src/main/java/com/dshpet/android/DailyReminderScheduler.kt").write_text(r'''package com.dshpet.android

          import android.app.AlarmManager
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.os.Build
          import java.util.Calendar

          object DailyReminderScheduler {
              private const val ACTION = "com.dshpet.android.action.DAILY_REST_REMINDER"
              private const val CHANNEL_ID = "dsh_pet_rest_reminder"
              private const val REQUEST_CODE = 8218
              private const val NOTIFICATION_ID = 8218

              fun schedule(ctx: Context) {
                  try {
                      val manager = ctx.getSystemService(Context.ALARM_SERVICE) as? AlarmManager ?: return
                      val next = Calendar.getInstance().apply {
                          add(Calendar.DAY_OF_YEAR, 1)
                          set(Calendar.HOUR_OF_DAY, 0)
                          set(Calendar.MINUTE, 0)
                          set(Calendar.SECOND, 0)
                          set(Calendar.MILLISECOND, 0)
                      }
                      val intent = Intent(ctx, DailyReminderReceiver::class.java).setAction(ACTION)
                      val pending = PendingIntent.getBroadcast(
                          ctx, REQUEST_CODE, intent,
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE,
                      )
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          manager.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, next.timeInMillis, pending)
                      } else {
                          manager.set(AlarmManager.RTC_WAKEUP, next.timeInMillis, pending)
                      }
                  } catch (_: Throwable) { }
              }

              fun showNotification(ctx: Context) {
                  try {
                      val manager = ctx.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O && manager.getNotificationChannel(CHANNEL_ID) == null) {
                          manager.createNotificationChannel(
                              NotificationChannel(CHANNEL_ID, "大肥鱼夜间休息提醒", NotificationManager.IMPORTANCE_DEFAULT)
                          )
                      }
                      val open = PendingIntent.getActivity(
                          ctx, REQUEST_CODE, Intent(ctx, MainActivity::class.java),
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE,
                      )
                      val notification = Notification.Builder(ctx, CHANNEL_ID)
                          .setSmallIcon(R.drawable.ic_launcher)
                          .setContentTitle("主人，已经凌晨了 🌙")
                          .setContentText("今天辛苦啦，记得休息。大肥鱼明天还在这里陪你。")
                          .setContentIntent(open)
                          .setAutoCancel(true)
                          .setWhen(System.currentTimeMillis())
                          .build()
                      manager.notify(NOTIFICATION_ID, notification)
                  } catch (_: Throwable) { }
              }
          }

          class DailyReminderReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent?) {
                  if (intent?.action != "com.dshpet.android.action.DAILY_REST_REMINDER") return
                  DailyReminderScheduler.schedule(context)
                  DailyReminderScheduler.showNotification(context)
              }
          }
          ''', encoding="utf-8")
