      - name: Make proactive bubbles clickable and auto-open chat keyboard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_CHAT_TOUCH'
          from pathlib import Path
          import re

          service_path = Path('app/src/main/java/com/dshpet/android/PetService.kt')
          service = service_path.read_text(encoding='utf-8')
          start = service.find('    private fun say(pet: Pet, text: String')
          end = service.find('    private fun placeBubble(', start)
          if start < 0 or end < 0:
              raise SystemExit('Cannot find PetService.say()/placeBubble() anchors')
          block = service[start:end]
          if 'openChat: Boolean = false' not in block:
              block = block.replace(
                  '    private fun say(pet: Pet, text: String) {',
                  '    private fun say(pet: Pet, text: String, openChat: Boolean = false) {', 1,
              )
          if 'this.text = if (openChat)' not in block:
              if '            this.text = text\n' not in block:
                  raise SystemExit('Cannot locate bubble text assignment')
              block = block.replace(
                  '            this.text = text\n',
                  '            this.text = if (openChat) "$text\\n· 点我聊天" else text\n', 1,
              )
          touch_flags = '''            WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,'''
          timeout_old = '            bubbleUntilMs = now + 3600L'
          timeout_new = '            bubbleUntilMs = now + if (openChat) 9000L else 3600L'
          if timeout_new not in block:
              if timeout_old not in block:
                  raise SystemExit('Cannot find bubble timeout anchor')
              block = block.replace(timeout_old, timeout_new, 1)
          touch_flags_new = '''            WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          (if (openChat) 0 else WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE) or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,'''
          if 'if (openChat) 0 else WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE' not in block:
              if touch_flags not in block:
                  raise SystemExit('Cannot locate bubble touch flags')
              block = block.replace(touch_flags, touch_flags_new, 1)
          if '点击主动气泡打开聊天失败' not in block:
              anchor = '        box.addView(\n            tv,\n'
              click_code = '''        if (openChat) {
            val openChatListener = View.OnClickListener {
                dismissBubble()
                try {
                    startActivity(
                        Intent(this, LocalCompanionActivity::class.java)
                            .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                    )
                } catch (t: Throwable) {
                    Diag.record(this, "点击主动气泡打开聊天失败", t)
                }
            }
            // Both the text card and its decorative tail enter chat.
            box.isClickable = true
            box.setOnClickListener(openChatListener)
            tv.isClickable = true
            tv.setOnClickListener(openChatListener)
          }
          box.addView(
            tv,
          '''
              if anchor not in block:
                  raise SystemExit('Cannot find bubble TextView insertion anchor')
              block = block.replace(anchor, click_code, 1)
          service = service[:start] + block + service[end:]
          proactive_call = 'say(pet, LocalCompanionMemory.proactiveLine(this))'
          if 'say(pet, LocalCompanionMemory.proactiveLine(this), openChat = true)' not in service:
              if proactive_call not in service:
                  raise SystemExit('Cannot find proactive companion bubble call')
              service = service.replace(proactive_call, 'say(pet, LocalCompanionMemory.proactiveLine(this), openChat = true)', 1)
          # App-use nudges are also invitations to continue chatting.
          app_reminder_call = 'say(pet, message)'
          if 'say(pet, message, openChat = true)' not in service:
              if app_reminder_call not in service:
                  raise SystemExit('Cannot find social-app reminder bubble call')
              service = service.replace(app_reminder_call, 'say(pet, message, openChat = true)', 1)
          service_path.write_text(service, encoding='utf-8')

          activity_path = Path('app/src/main/java/com/dshpet/android/LocalCompanionActivity.kt')
          activity = activity_path.read_text(encoding='utf-8')
          if 'import android.view.inputmethod.InputMethodManager' not in activity:
              anchor = 'import android.view.inputmethod.EditorInfo\n'
              if anchor not in activity:
                  raise SystemExit('Cannot locate chat activity input-method imports')
              activity = activity.replace(anchor, anchor + 'import android.view.inputmethod.InputMethodManager\nimport android.view.WindowManager\n', 1)
          if 'imm?.showSoftInput(input, InputMethodManager.SHOW_IMPLICIT)' not in activity:
              pattern = re.compile(r'(?m)^(?P<i>[ \t]*)setContentView\(root\)\n(?P=i)updateProactiveButton\(\)\n(?P=i)renderHistory\(\)$')
              match = pattern.search(activity)
              if not match:
                  raise SystemExit('Cannot locate chat activity setContentView/initial render block')
              i = match.group('i')
              replacement = (
                  f'{i}window.setSoftInputMode(\n'
                  f'{i}    WindowManager.LayoutParams.SOFT_INPUT_ADJUST_RESIZE or\n'
                  f'{i}        WindowManager.LayoutParams.SOFT_INPUT_STATE_ALWAYS_VISIBLE\n'
                  f'{i})\n'
                  f'{i}setContentView(root)\n'
                  f'{i}updateProactiveButton()\n'
                  f'{i}renderHistory()\n'
                  f'{i}input.requestFocus()\n'
                  f'{i}input.post {{\n'
                  f'{i}    val imm = getSystemService(INPUT_METHOD_SERVICE) as? InputMethodManager\n'
                  f'{i}    imm?.showSoftInput(input, InputMethodManager.SHOW_IMPLICIT)\n'
                  f'{i}}}'
              )
              activity = activity[:match.start()] + replacement + activity[match.end():]
          activity_path.write_text(activity, encoding='utf-8')
          print('Proactive bubbles are touchable and open the chat; chat launch requests the keyboard.')
          PY_CHAT_TOUCH

      - name: Harden birthday retry and launcher detection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_HARDEN'
          from pathlib import Path

          def patch(path, before, after, marker):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if marker in text:
                  print(f"Already patched: {path}")
                  return
              if before not in text:
                  raise SystemExit(f"Cannot patch {path}; source anchor not found: {before[:90]!r}")
              p.write_text(text.replace(before, after, 1), encoding="utf-8")
              print(f"Patched: {path}")

          service = "app/src/main/java/com/dshpet/android/PetService.kt"

          # If the phone is locked (or the pet hidden) when the birthday alarm fires, retry for up to 12 hours
          # instead of silently dropping the celebration.
          patch(
              service,
              'private var lastProactiveMs = 0L\n',
              'private var lastProactiveMs = 0L\n    private var birthdayRetryUntilMs = 0L\n',
              'private var birthdayRetryUntilMs = 0L',
          )
          patch(
              service,
              '    private fun birthdayCelebration() {\n        try {\n            if (!isScreenInteractiveUnlocked() || landscapeHidden || menuView != null || LocalCompanionMemory.isChatOpen(this)) return\n',
              '    private fun birthdayCelebration() {\n        try {\n            if (!isScreenInteractiveUnlocked() || landscapeHidden || menuView != null || LocalCompanionMemory.isChatOpen(this)) {\n                // Locked screen or hidden pet right now: retry from the speech ticker.\n                if (birthdayRetryUntilMs == 0L) birthdayRetryUntilMs = System.currentTimeMillis() + 12L * 60L * 60L * 1000L\n                return\n            }\n            birthdayRetryUntilMs = 0L\n',
              '// Locked screen or hidden pet right now: retry from the speech ticker.',
          )
          patch(
              service,
              'maybeSendAppReminder(System.currentTimeMillis())\n',
              'maybeSendAppReminder(System.currentTimeMillis())\n        if (birthdayRetryUntilMs > 0L) {\n            if (System.currentTimeMillis() > birthdayRetryUntilMs) birthdayRetryUntilMs = 0L\n            else birthdayCelebration()\n        }\n',
              'if (birthdayRetryUntilMs > 0L) {',
          )

          # Android 11+ package visibility: without this, resolving the HOME activity can return null, and the pets
          # would be hidden even while the launcher is in front in landscape.
          manifest_path = Path("app/src/main/AndroidManifest.xml")
          manifest = manifest_path.read_text(encoding="utf-8")
          app_index = manifest.find("<application")
          if app_index < 0:
              raise SystemExit("Cannot find <application> in AndroidManifest.xml")
          if "android.intent.category.HOME" in manifest[:app_index]:
              print("Launcher package visibility already declared")
          else:
              line_start = manifest.rfind("\n", 0, app_index) + 1
              queries = (
                  "    <queries>\n"
                  "        <intent>\n"
                  '            <action android:name="android.intent.action.MAIN" />\n'
                  '            <category android:name="android.intent.category.HOME" />\n'
                  "        </intent>\n"
                  "    </queries>\n\n"
              )
              manifest_path.write_text(manifest[:line_start] + queries + manifest[line_start:], encoding="utf-8")
              print("Declared launcher package visibility for foreground-app detection")
          PY_HARDEN

